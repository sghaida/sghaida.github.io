name: Build and deploy Jekyll site (gh-pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Build site
        run: bundle exec jekyll build --destination ./_site

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Use a Personal Access Token with `repo` scope if branch protection
          # prevents the default GITHUB_TOKEN from pushing. Create a secret
          # named `GH_PAGES_TOKEN` in repository Settings → Secrets → Actions
          # and give it a PAT with repo permissions.
          github_token: ${{ secrets.GH_PAGES_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false

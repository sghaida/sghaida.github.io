<div class="post-sharing d-inline-block ms-2">
  <button
    type="button"
    class="share-btn btn btn-outline-secondary btn-sm"
    aria-label="Copy link"
    data-url="{{ page.url | absolute_url }}"
  >
    <i class="fa fa-link" aria-hidden="true"></i>
  </button>

  <a
    class="share-twitter btn btn-outline-secondary btn-sm ms-1"
    href="https://twitter.com/intent/tweet?text={{ page.title | uri_escape }}&url={{ page.url | absolute_url | uri_escape }}"
    target="_blank" rel="noopener noreferrer"
    aria-label="Share on Twitter"
  >
    <i class="fab fa-twitter" aria-hidden="true"></i>
  </a>

  <a
    class="share-linkedin btn btn-outline-secondary btn-sm ms-1"
    href="https://www.linkedin.com/shareArticle?mini=true&url={{ page.url | absolute_url | uri_escape }}&title={{ page.title | uri_escape }}"
    target="_blank" rel="noopener noreferrer"
    aria-label="Share on LinkedIn"
  >
    <i class="fab fa-linkedin" aria-hidden="true"></i>
  </a>

  <span class="share-feedback visually-hidden ms-2" role="status" aria-live="polite">Copied</span>
</div>

<script>
;(function(){
  function showFeedback(fb, text){ if(fb){ fb.classList.remove('visually-hidden'); fb.textContent = text || 'Copied'; setTimeout(function(){ fb.classList.add('visually-hidden') }, 1400) } }

  function copyText(url, fb){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ showFeedback(fb) }).catch(function(){ window.location.href = 'mailto:?body=' + encodeURIComponent(url) })
    } else {
      try{ var ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showFeedback(fb) }
      catch(e){ showFeedback(fb, url || 'Copied'); if(!fb){ window.prompt('Copy this link', url) } }
    }
  }

  document.addEventListener('click', function(e){
    var btn = e.target.closest('.share-btn')
    if(!btn) return
    var url = btn.getAttribute('data-url') || window.location.href
    var container = btn.closest('.post-sharing')
    var fb = container && container.querySelector('.share-feedback')
    copyText(url, fb)
  })
})()
</script>

# --- Site settings ---
title: sghaida
# Tagline shown as the sidebar subtitle; keep description separate for SEO/feed
tagline: "/dev/urandom &> thoughts"
email: saddam.abughaida@gmail.com
description: >-
    a place to consolidate and share my thoughts Math, Software, Philosophy and politics.
baseurl: ""
url: "https://sghaida.github.io"

twitter_username: sghaida
github_username: sghaida

# --- Locale ---
lang: en
timezone: Europe/Berlin

# --- Theme ---
theme: jekyll-theme-chirpy

# --- Plugins ---
plugins:
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-sitemap

# Collections used by the site (enable folders starting with "_")
collections:
  tabs:
    output: true
    permalink: /tabs/:name/

# --- Pagination (required by Chirpy) ---
paginate: 10
paginate_path: "/page:num/"


# --- Archives (Chirpy-compatible) ---
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

# --- Exclude ---
exclude:
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md

# the avatar on sidebar, support local or CORS resources
avatar: ./assets/img/me.jpg

# boolean type, the global switch for ToC in posts.
toc: true

disqus:
  comments: false  # boolean type, the global switch for posts comments.
  shortname: ''    # Fill with your Disqus shortname. › https://help.disqus.com/en/articles/1717111-what-s-a-shortname

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:   # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1


defaults:
  -
    scope:
      path: ''          # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true    # Enable comments in posts.
      toc: true         # Display TOC column in posts.
      # DO NOT modify the following parameter unless you are confident enough
      # to update the code of all other post links in this project.
      permalink: /posts/:title/
  -
    scope:
      path: _drafts
    values:
      comments: false
  -
    scope:
      path: ''
      type: tabs             # see `site.collections`
    values:
      layout: page
      permalink: /:title/
      dynamic_title: true    # Hide title in mobile screens.

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

social:
  # Change to your full name.
  # It will be displayed as the default author of the posts and the copyright owner in the Footer
  name: Saddam Abu Ghaida
  email: saddam.abughaida@gmail.com            # change to your email address
  links:
    # The first element serves as the copyright owner's link
    - https://twitter.com/sghaida      # change to your twitter homepage
    - https://github.com/sghaida       # change to your github homepage
    # Uncomment below to add more social links
    # - https://www.facebook.com/username
    - https://www.linkedin.com/in/sghaida

  # Analytics (example)
  # To enable Google Analytics (GA4) add your measurement id below and the
  # theme will include the tracking snippet in production builds.
analytics:
  google:
    id: G-MYGCEXHTDF
